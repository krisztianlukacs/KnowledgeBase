# prokb — knowledgebase.yaml (generated by `kb init`)
# See: https://github.com/krisztianlukacs/KnowledgeBase

version: 1
project_name: KnowledgeBase
collection_name: KnowledgeBase_knowledge

scan:
  include:
    - "**/*.md"
    # - "src/**/*.py"
    # - "tools/**/*.py"
  # Rendered from DEFAULTS in config.py (one list, no drift). `knowledge` is
  # excluded (chroma_db/manifest/translations) but knowledge/diary/ is still
  # indexed (scanner.py whitelist); `.claude` holds agent worktrees.
  exclude_dirs:
    - .git
    - .venv
    - venv
    - env
    - __pycache__
    - node_modules
    - dist
    - build
    - .next
    - target
    - .cache
    - .idea
    - .vscode
    - .ipynb_checkpoints
    - .mypy_cache
    - .ruff_cache
    - .pytest_cache
    - knowledge
    - .mempalace
    - mlruns
    - data
    - .claude
    - .hypothesis
  exclude_files:
    - knowledgebase.yaml
    - manifest.json

embedding:
  model: all-mpnet-base-v2
  # Available models:
  #   all-mpnet-base-v2            (420 MB, 768-dim, English-strong)
  #   all-MiniLM-L6-v2             (90 MB, 384-dim, faster)
  #   intfloat/multilingual-e5-large (2 GB, 1024-dim, 50+ langs incl. Hungarian)
  #   BAAI/bge-large-en-v1.5       (1.3 GB, 1024-dim, SOTA English)
  device: cpu                      # cpu / cuda / mps

translation:
  enabled: false
  # Set enabled: true to pre-translate source files via Claude Code
  # before indexing (useful if using an English-only embedding model
  # and your source files are in another language).
  source_language: hu              # ISO 639-1
  target_language: en
  translations_dir: knowledge/translations

chunking:
  max_tokens: 1500
  min_tokens: 50

paths:
  chroma_db: knowledge/chroma_db
  manifest: knowledge/manifest.json
